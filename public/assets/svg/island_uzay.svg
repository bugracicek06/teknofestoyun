<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6B21A8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#070B19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Base Lunar Platform -->
  <ellipse cx="150" cy="220" rx="130" ry="55" fill="url(#moonGrad)" stroke="#C084FC" stroke-width="4"/>

  <!-- Moon Craters -->
  <circle cx="90" cy="225" r="14" fill="#1E293B" opacity="0.5"/>
  <circle cx="160" cy="240" r="10" fill="#1E293B" opacity="0.5"/>
  <circle cx="210" cy="220" r="16" fill="#1E293B" opacity="0.5"/>

  <!-- Cosmic Purple Aura -->
  <circle cx="150" cy="130" r="85" fill="url(#spaceGlow)"/>

  <!-- Space Rocket -->
  <g transform="translate(150, 110)">
    <!-- Rocket Main Body -->
    <path d="M 0 -65 C 18 -30 20 20 18 40 L -18 40 C -20 20 -18 -30 0 -65 Z" fill="url(#rocketGrad)" stroke="#A855F7" stroke-width="2"/>
    <!-- Rocket Fins -->
    <path d="M -18 10 L -40 45 L -18 40 Z" fill="#7E22CE"/>
    <path d="M 18 10 L 40 45 L 18 40 Z" fill="#7E22CE"/>
    <!-- Porthole Window -->
    <circle cx="0" cy="-20" r="12" fill="#00F2FE" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="-3" cy="-23" r="3" fill="#FFFFFF"/>
    <!-- Red Stripe -->
    <rect x="-18" y="5" width="36" height="8" fill="#EF4444"/>
    <!-- Exhaust Flame -->
    <polygon points="-12,42 0,75 12,42" fill="#FF5722"/>
    <polygon points="-6,42 0,60 6,42" fill="#FFD700"/>
  </g>

  <!-- Satellite Floating -->
  <g transform="translate(60, 80) scale(0.6)">
    <rect x="-15" y="-10" width="30" height="20" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2"/>
    <rect x="-55" y="-6" width="35" height="12" fill="#3B82F6"/>
    <rect x="20" y="-6" width="35" height="12" fill="#3B82F6"/>
  </g>

  <!-- Stars -->
  <polygon points="230,70 233,76 240,76 235,80 237,86 230,82 223,86 225,80 220,76 227,76" fill="#FFD700"/>
  <circle cx="250" cy="110" r="3" fill="#FFFFFF"/>
  <circle cx="50" cy="130" r="2.5" fill="#C084FC"/>
</svg>
