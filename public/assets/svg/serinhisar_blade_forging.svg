      <stop offset="0%" stop-color="#4E1404"/>
      <stop offset="25%" stop-color="#D84315"/>
      <stop offset="60%" stop-color="#FF8F00"/>
      <stop offset="85%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFF59D"/>
