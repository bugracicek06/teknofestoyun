    <line x1="75" y1="29" x2="200" y2="29" stroke="#FFF59D" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>

    <!-- Hammer Indentations -->
    <ellipse cx="95" cy="24" rx="7" ry="3" fill="#BF360C" opacity="0.7"/>
    <ellipse cx="130" cy="35" rx="8" ry="3.5" fill="#BF360C" opacity="0.7"/>
