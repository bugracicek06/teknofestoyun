<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 85" width="150" height="85">
  <defs>
    <linearGradient id="forgingPlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFCA28"/>
      <stop offset="65%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#5D1504"/>
    </linearGradient>
    <filter id="forgingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FF5722" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#forgingGlow)">
    <!-- Pointed Triangular Iron Plowshare Blade (Hot Form) -->
    <!-- Blade Socket Base -->
    <path d="M 22 28 L 60 16 L 138 42 L 56 68 L 18 56 Q 26 42 22 28 Z" fill="url(#forgingPlowGrad)" stroke="#FFA000" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Central Strengthening Ridge -->
    <path d="M 38 42 L 138 42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M 45 42 L 130 42" stroke="#FFF9C4" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Hammer Impact Marks -->
    <ellipse cx="65" cy="32" rx="6" ry="3" fill="#D84315" opacity="0.7"/>
    <ellipse cx="88" cy="48" rx="7" ry="3.5" fill="#D84315" opacity="0.7"/>
    <ellipse cx="105" cy="38" rx="5" ry="2.5" fill="#D84315" opacity="0.7"/>
  </g>
</svg>
