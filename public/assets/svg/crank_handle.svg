<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="crankArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Central Shaft Pivot -->
  <circle cx="80" cy="80" r="22" fill="#070B19" stroke="#FFD700" stroke-width="4"/>
  <!-- Metallic Crank Lever Arm extending outward -->
  <rect x="70" y="20" width="20" height="60" rx="8" fill="url(#crankArm)" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Outer Knob Handle Touch Point -->
  <circle cx="80" cy="25" r="20" fill="#E67E22" stroke="#FFD700" stroke-width="3"/>
  <circle cx="80" cy="25" r="8" fill="#FFFFFF" opacity="0.8"/>
</svg>
