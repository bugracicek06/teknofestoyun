<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65" width="280" height="65">
  <defs>
    <!-- Mirror Polished High-Carbon Tempered Steel Gradient -->
    <linearGradient id="polishedSteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="20%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="90%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="walnutWoodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F0D04"/>
      <stop offset="30%" stop-color="#4A200B"/>
      <stop offset="70%" stop-color="#6B3012"/>
      <stop offset="100%" stop-color="#2D1204"/>
    </linearGradient>
    <filter id="steelKnifeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#steelKnifeShadow)">
    <!-- Ergonomic Walnut Wood Handle with Brass Rivets -->
    <path d="M 15 24 C 20 18, 55 18, 75 20 L 78 45 C 55 48, 20 48, 15 42 Z" fill="url(#walnutWoodGrad)" stroke="#1A0A02" stroke-width="2"/>
    <circle cx="32" cy="33" r="2.5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1"/>
    <circle cx="58" cy="33" r="2.5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1"/>

    <!-- Brass Bolster / Finger Guard -->
    <rect x="75" y="18" width="10" height="30" rx="2" fill="#D97706" stroke="#FDE047" stroke-width="1.5"/>

    <!-- High-Carbon Serinhisar Steel Blade -->
    <path d="M 85 20 L 210 18 Q 235 21, 268 32 Q 225 45, 140 44 L 85 46 Z" fill="url(#polishedSteelGrad)" stroke="#94A3B8" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Razor Sharp Bevel & Edge Line -->
    <path d="M 85 46 L 140 44 Q 225 45, 268 32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Spine Fuller Groove (Kan Oluğu) -->
    <path d="M 98 25 L 205 23" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 100 25 L 203 23" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/>

    <!-- Specular Blade Sheen -->
    <line x1="88" y1="21" x2="208" y2="19" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>
