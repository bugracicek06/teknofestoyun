<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="foxReliefStone" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#D99B52" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#8C4E1A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4D250A" stop-opacity="0"/>
    </radialGradient>
    <filter id="chiselFoxDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#261003" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Seamless Organic Bas-Relief Stone Bed -->
  <path d="M 50 8 Q 88 12 92 50 Q 94 86 50 92 Q 10 88 8 50 Q 8 14 50 8 Z" fill="url(#foxReliefStone)"/>

  <!-- Engraved Chiseled Fox (Göbeklitepe Pillar 9/10 Inverted Standing Cunning Fox) -->
  <g filter="url(#chiselFoxDepth)">
    <!-- Main Fox Body (Head downwards, arched back, bushy tail) -->
    <path d="M 48 20 Q 64 26 66 45 Q 68 62 55 76 Q 48 84 38 82 Q 32 78 36 68 Q 42 58 40 45 Q 38 32 48 20 Z" fill="#3D1C06"/>
    <!-- Fox Head & Muzzle pointing forward/down -->
    <path d="M 48 20 L 32 16 L 36 28 Z" fill="#3D1C06"/>
    <!-- Fox Pointed Ears -->
    <path d="M 50 18 L 56 10 L 58 18 Z" fill="#3D1C06"/>
    <!-- Slender Legs -->
    <path d="M 40 45 L 26 50 L 30 54 M 44 60 L 32 68 L 36 72" stroke="#3D1C06" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Long Bushy Tail curving upwards -->
    <path d="M 55 76 Q 74 72 78 50 Q 80 34 68 28" fill="none" stroke="#3D1C06" stroke-width="6" stroke-linecap="round"/>

    <!-- High-Relief Sunlit Rim Highlights -->
    <path d="M 56 10 L 50 18 L 32 16 L 36 28" fill="none" stroke="#FFF7E6" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 48 20 Q 64 26 66 45 Q 68 62 55 76" fill="none" stroke="#FFF7E6" stroke-width="2" opacity="0.75"/>
    <path d="M 55 76 Q 74 72 78 50" fill="none" stroke="#FFF7E6" stroke-width="2.2" opacity="0.8"/>
  </g>

  <!-- Chisel Inscription Details -->
  <circle cx="36" cy="22" r="1.5" fill="#FFF7E6"/>
</svg>
