<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hammerSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-40 60 60)">
    <!-- Wooden Handle -->
    <rect x="53" y="45" width="14" height="65" rx="4" fill="#6D4C41" stroke="#3E2723" stroke-width="2"/>
    <!-- Heavy Iron Hammer Head -->
    <rect x="35" y="25" width="50" height="28" rx="4" fill="url(#hammerSteel)" stroke="#FFD700" stroke-width="2"/>
    <!-- Striking Face Specular -->
    <rect x="35" y="27" width="8" height="24" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
