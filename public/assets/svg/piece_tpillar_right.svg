<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 300" width="140" height="300">
  <defs>
    <!-- Warm Sunlit Limestone Gradients matching background lighting -->
    <linearGradient id="tpillarCapGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="30%" stop-color="#E8B774"/>
      <stop offset="75%" stop-color="#A5662B"/>
      <stop offset="100%" stop-color="#542B0D"/>
    </linearGradient>

    <linearGradient id="tpillarShaftGradR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDF1D8"/>
      <stop offset="35%" stop-color="#DFAC69"/>
      <stop offset="80%" stop-color="#9C5F25"/>
      <stop offset="100%" stop-color="#4C250A"/>
    </linearGradient>

    <linearGradient id="rightBevelGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#804B1B"/>
      <stop offset="100%" stop-color="#3D1E08"/>
    </linearGradient>

    <filter id="monolithShadowR" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="-3" dy="6" stdDeviation="4" flood-color="#1A0D04" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#monolithShadowR)">
    <!-- Base Pedestal Ground Contact Shadow -->
    <ellipse cx="70" cy="285" rx="55" ry="12" fill="#200F05" opacity="0.65"/>

    <!-- Right 3D Extruded Depth Facet -->
    <polygon points="102,68 116,72 126,274 112,282" fill="url(#rightBevelGradR)" opacity="0.9"/>

    <!-- Main Vertical Megalith Shaft -->
    <polygon points="38,68 100,68 106,278 28,282" fill="url(#tpillarShaftGradR)" stroke="#8A4A16" stroke-width="2"/>

    <!-- Archaic Göbeklitepe Arm & Hand Contours (Pillar 31 - Twin Facing Left) -->
    <!-- Bent Arm Facing Inward -->
    <path d="M 42 120 L 68 155 L 68 185" fill="none" stroke="#5E2F0A" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 43 122 L 67 156 L 67 186" fill="none" stroke="#FFF7E6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Fingers touching at front belt line -->
    <path d="M 68 185 L 78 188 M 68 189 L 80 192 M 68 193 L 78 196" fill="none" stroke="#5E2F0A" stroke-width="2" opacity="0.7"/>
    <!-- Ritual Belt & Loincloth -->
    <path d="M 38 202 L 96 205 L 98 216 L 36 213 Z" fill="#6E350C" opacity="0.6"/>
    <path d="M 64 214 L 66 250 L 76 248 L 72 215 Z" fill="#582909" opacity="0.6"/>

    <!-- Chiseled Weathering Lines -->
    <path d="M 94 95 L 80 106 L 84 128" fill="none" stroke="#4F2709" stroke-width="1.8" opacity="0.6"/>
    <path d="M 55 220 L 48 245 L 58 265" fill="none" stroke="#4F2709" stroke-width="1.8" opacity="0.55"/>

    <!-- Sunlight Top/Right Edge Specular Highlight -->
    <line x1="98" y1="70" x2="105" y2="278" stroke="#FFF9EB" stroke-width="2.5" opacity="0.75"/>

    <!-- Horizontal Megalith T-Cap Head -->
    <!-- Cap Right 3D Depth -->
    <polygon points="124,14 136,24 124,72 124,66" fill="#3D1E08" opacity="0.95"/>
    <!-- Main Cap Face -->
    <polygon points="14,14 124,14 124,66 6,66" fill="url(#tpillarCapGradR)" stroke="#8A4A16" stroke-width="2.5"/>

    <!-- Cap Top Sunlight Rim Specular -->
    <line x1="16" y1="17" x2="122" y2="17" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- Weathering / Chisel Notch on T-Cap -->
    <path d="M 102 28 L 88 42 L 96 54" fill="none" stroke="#482208" stroke-width="2" opacity="0.7"/>
    <path d="M 46 32 L 54 46" fill="none" stroke="#482208" stroke-width="1.8" opacity="0.6"/>
  </g>
</svg>
