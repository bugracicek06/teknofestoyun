<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="boarReliefStone" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#D99B52" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#8C4E1A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4D250A" stop-opacity="0"/>
    </radialGradient>
    <filter id="chiselBoarDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#261003" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Seamless Organic Bas-Relief Stone Bed -->
  <path d="M 50 10 Q 90 12 94 50 Q 92 88 50 94 Q 10 90 8 50 Q 12 12 50 10 Z" fill="url(#boarReliefStone)"/>

  <!-- Engraved Chiseled Wild Boar (Göbeklitepe Pillar 12/43 Strong Horizontal Boar) -->
  <g filter="url(#chiselBoarDepth)">
    <!-- Muscular Boar Body -->
    <path d="M 22 55 Q 32 30 58 32 Q 78 30 84 44 Q 90 56 82 66 Q 72 74 48 72 Q 28 72 20 62 Z" fill="#3D1C06"/>
    <!-- Heavy Snout & Head with Tusks -->
    <path d="M 84 44 L 92 48 L 84 56 Z" fill="#3D1C06"/>
    <!-- Tusk -->
    <path d="M 86 52 L 92 46 L 88 54 Z" fill="#FFF7E6"/>
    <!-- Bristles / Mane Along Back -->
    <path d="M 38 32 L 36 24 L 42 31 M 48 31 L 47 22 L 53 30 M 58 32 L 58 23 L 64 31 M 68 33 L 69 25 L 73 34" stroke="#3D1C06" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Short Sturdy Legs -->
    <path d="M 32 68 L 30 84 L 36 84 M 42 70 L 40 82 L 46 82 M 64 70 L 62 84 L 68 84 M 74 68 L 73 82 L 78 82" stroke="#3D1C06" stroke-width="4" stroke-linecap="round"/>
    <!-- Short Tail -->
    <path d="M 22 55 L 12 52 L 14 58" stroke="#3D1C06" stroke-width="3.5" stroke-linecap="round"/>

    <!-- High-Relief Sunlit Rim Highlights -->
    <path d="M 22 55 Q 32 30 58 32 Q 78 30 84 44 L 92 48" fill="none" stroke="#FFF7E6" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M 36 24 L 42 31 M 47 22 L 53 30 M 58 23 L 64 31" stroke="#FFF7E6" stroke-width="1.5" opacity="0.8"/>
  </g>

  <circle cx="80" cy="46" r="1.5" fill="#FFF7E6"/>
</svg>
