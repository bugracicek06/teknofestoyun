    <path d="M 87 18 L 92 30" fill="none" stroke="#FFFDF2" stroke-width="1.5" opacity="0.85"/>
    <path d="M 34 48 Q 40 46 64 34 Q 88 34 94 44" fill="none" stroke="#FFFDF2" stroke-width="2" opacity="0.85"/>
    <path d="M 34 48 Q 18 50 8 40" fill="none" stroke="#FFFDF2" stroke-width="1.8" opacity="0.8"/>

    <!-- Eye Detail -->
