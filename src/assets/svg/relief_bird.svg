<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="birdReliefStone" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#D99B52" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#8C4E1A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4D250A" stop-opacity="0"/>
    </radialGradient>
    <filter id="chiselBirdDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#261003" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Seamless Organic Bas-Relief Stone Bed -->
  <path d="M 50 8 Q 92 10 94 50 Q 92 90 50 94 Q 8 90 8 50 Q 10 10 50 8 Z" fill="url(#birdReliefStone)"/>

  <!-- Engraved Chiseled Crane / Bird with Spread Wings (Göbeklitepe Pillar 43 Vulture/Crane) -->
  <g filter="url(#chiselBirdDepth)">
    <!-- Central Bird Body -->
    <path d="M 44 40 Q 50 34 56 40 Q 60 55 58 70 Q 50 78 42 70 Q 40 55 44 40 Z" fill="#3D1C06"/>
    <!-- Graceful Long Neck & Head -->
    <path d="M 50 36 Q 50 20 62 18 Q 72 16 78 22 L 68 25 Q 58 24 54 36 Z" fill="#3D1C06"/>
    <!-- Pointed Beak -->
    <path d="M 72 16 L 86 14 L 76 22 Z" fill="#3D1C06"/>

    <!-- Left Wing (Spread Outwards) -->
    <path d="M 44 42 Q 28 32 14 36 Q 22 46 32 50 Q 42 54 44 58 Z" fill="#3D1C06"/>
    <path d="M 14 36 L 10 44 L 20 44 M 20 44 L 18 52 L 28 50" stroke="#3D1C06" stroke-width="2"/>

    <!-- Right Wing (Spread Outwards) -->
    <path d="M 56 42 Q 72 32 86 36 Q 78 46 68 50 Q 58 54 56 58 Z" fill="#3D1C06"/>
    <path d="M 86 36 L 90 44 L 80 44 M 80 44 L 82 52 L 72 50" stroke="#3D1C06" stroke-width="2"/>

    <!-- Long Slender Crane Legs -->
    <path d="M 46 72 L 44 90 M 54 72 L 56 90" stroke="#3D1C06" stroke-width="3.5" stroke-linecap="round"/>

    <!-- High-Relief Sunlit Rim Highlights -->
    <path d="M 72 16 L 86 14 L 76 22 Q 58 24 54 36" fill="none" stroke="#FFF7E6" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 44 42 Q 28 32 14 36" fill="none" stroke="#FFF7E6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 56 42 Q 72 32 86 36" fill="none" stroke="#FFF7E6" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <circle cx="72" cy="18" r="1.2" fill="#FFF7E6"/>
</svg>
