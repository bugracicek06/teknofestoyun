<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 190" width="76" height="190">
  <defs>
    <!-- Gilded Brass / Cast Bronze Gradient -->
    <linearGradient id="guardBrassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="20%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="90%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Metallic Specular Highlight -->
    <linearGradient id="guardHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Quillon Vertical Gradient -->
    <linearGradient id="quillonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="15%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <filter id="guardDropShadow" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#guardDropShadow)">
    <!-- 1. Cruciform Quillon Arms: Vertical arms extending from y = 10 to y = 180 -->
    <!-- Top Finial Bulb (y: 8 to 26) -->
    <circle cx="38" cy="16" r="10" fill="url(#guardBrassGrad)" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="38" cy="16" r="6" fill="#FDE68A" opacity="0.6"/>
    <circle cx="36" cy="14" r="2.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Bottom Finial Bulb (y: 164 to 182) -->
    <circle cx="38" cy="174" r="10" fill="url(#guardBrassGrad)" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="38" cy="174" r="6" fill="#FDE68A" opacity="0.6"/>
    <circle cx="36" cy="172" r="2.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Top & Bottom Flared Arm Bars -->
    <path d="M 32 24 
             C 32 45, 34 65, 26 76 
             L 50 76 
             C 42 65, 44 45, 44 24 
             Z" 
          fill="url(#quillonGrad)" 
          stroke="#78350F" 
          stroke-width="1.5"/>

    <path d="M 26 114 
             C 34 125, 32 145, 32 166 
             L 44 166 
             C 44 145, 42 125, 50 114 
             Z" 
          fill="url(#quillonGrad)" 
          stroke="#78350F" 
          stroke-width="1.5"/>

    <!-- 2. Central Block with Historical Ottoman Diamond Langets (Dilcikler) -->
    <!-- Left Langet (reaching over blade ricasso): pointed tip at (5, 95) -->
    <!-- Right Langet (reaching over grip ferrule): pointed tip at (71, 95) -->
    <path d="M 38 68 
             C 24 68, 16 80, 5 95 
             C 16 110, 24 122, 38 122 
             C 52 122, 60 110, 71 95 
             C 60 80, 52 68, 38 68 
             Z" 
          fill="url(#guardBrassGrad)" 
          stroke="#78350F" 
          stroke-width="2"/>

    <!-- 3. Central Medallion & Ottoman Floral Relief Engraving -->
    <circle cx="38" cy="95" r="15" fill="#78350F" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="38" cy="95" r="11" fill="url(#guardHighlight)"/>

    <!-- 8-Point Rosette Star Engraving -->
    <path d="M 38 86 L 41 92 L 47 92 L 42 96 L 44 102 L 38 98 L 32 102 L 34 96 L 29 92 L 35 92 Z" 
          fill="#451A03" 
          stroke="#FEF08A" 
          stroke-width="0.8"/>
    <circle cx="38" cy="95" r="3" fill="#FFFFFF"/>

    <!-- Filigree Relief Lines on Langets -->
    <path d="M 12 95 Q 24 91, 30 95" stroke="#78350F" stroke-width="1.5" fill="none"/>
    <path d="M 12 95 Q 24 99, 30 95" stroke="#FEF08A" stroke-width="1" fill="none"/>
    <path d="M 64 95 Q 52 91, 46 95" stroke="#78350F" stroke-width="1.5" fill="none"/>
    <path d="M 64 95 Q 52 99, 46 95" stroke="#FEF08A" stroke-width="1" fill="none"/>

    <!-- Edge Specular Bevel Highlights -->
    <line x1="34" y1="28" x2="34" y2="70" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>
    <line x1="34" y1="120" x2="34" y2="162" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>
  </g>
</svg>
