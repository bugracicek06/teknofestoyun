<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 190" width="76" height="190">
  <defs>
    <!-- Gilded Brass / Cast Bronze Gradient -->
    <linearGradient id="guardBrassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="15%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Metallic Specular Highlight -->
    <linearGradient id="guardHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FCD34D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Quillon Arm Vertical Gradient -->
    <linearGradient id="quillonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="15%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Spherical Sphere Gradient for Quillon Finials -->
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="90%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>

    <filter id="guardDropShadow" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#guardDropShadow)">
    <!-- 1. Cruciform Quillon Arms: Vertical arms extending from y = 10 to y = 180 -->
    <!-- Top Finial Spherical Bulb (cy: 16) -->
    <circle cx="38" cy="16" r="11" fill="url(#sphereGrad)" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="35" cy="13" r="3.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Bottom Finial Spherical Bulb (cy: 174) -->
    <circle cx="38" cy="174" r="11" fill="url(#sphereGrad)" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="35" cy="171" r="3.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Top & Bottom Flared Arm Bars with Elegant Classical Contours -->
    <path d="M 32 26 
             C 31 45, 34 65, 24 76 
             L 52 76 
             C 42 65, 45 45, 44 26 
             Z" 
          fill="url(#quillonGrad)" 
          stroke="#78350F" 
          stroke-width="1.6"/>

    <path d="M 24 114 
             C 34 125, 31 145, 32 164 
             L 44 164 
             C 45 145, 42 125, 52 114 
             Z" 
          fill="url(#quillonGrad)" 
          stroke="#78350F" 
          stroke-width="1.6"/>

    <!-- 2. Central Bolster Block & Ottoman Diamond Langets (Dilcikler) -->
    <!-- Left Collar (reaches over blade ricasso): pointed tip at (4, 95) -->
    <!-- Right Collar (reaches over grip ferrule): pointed tip at (72, 95) -->
    <path d="M 38 68 
             C 24 68, 15 80, 4 95 
             C 15 110, 24 122, 38 122 
             C 52 122, 61 110, 72 95 
             C 61 80, 52 68, 38 68 
             Z" 
          fill="url(#guardBrassGrad)" 
          stroke="#78350F" 
          stroke-width="2"/>

    <!-- 3. Central Medallion & Ottoman Floral Relief Engraving -->
    <circle cx="38" cy="95" r="16" fill="#78350F" stroke="#FDE68A" stroke-width="1.6"/>
    <circle cx="38" cy="95" r="12" fill="url(#guardHighlight)"/>

    <!-- 8-Point Rosette Star Engraving (Selçuklu Yıldızı) -->
    <path d="M 38 85 L 41.5 91.5 L 48 91.5 L 42.5 95.5 L 44.5 102 L 38 98 L 31.5 102 L 33.5 95.5 L 28 91.5 L 34.5 91.5 Z" 
          fill="#451A03" 
          stroke="#FEF08A" 
          stroke-width="0.9"/>
    <circle cx="38" cy="95" r="3.2" fill="#FFFFFF"/>

    <!-- Filigree Relief Lines on Langets -->
    <path d="M 10 95 Q 24 90, 30 95" stroke="#78350F" stroke-width="1.6" fill="none"/>
    <path d="M 10 95 Q 24 100, 30 95" stroke="#FEF08A" stroke-width="1.1" fill="none"/>
    <path d="M 66 95 Q 52 90, 46 95" stroke="#78350F" stroke-width="1.6" fill="none"/>
    <path d="M 66 95 Q 52 100, 46 95" stroke="#FEF08A" stroke-width="1.1" fill="none"/>

    <!-- Edge Specular Bevel Highlights -->
    <line x1="33" y1="28" x2="33" y2="72" stroke="#FFFFFF" stroke-width="1.4" opacity="0.85"/>
    <line x1="33" y1="118" x2="33" y2="162" stroke="#FFFFFF" stroke-width="1.4" opacity="0.85"/>
  </g>
</svg>
