    <path d="M 63 52 Q 76 38 82 26 M 82 26 Q 90 20 87 13 M 82 26 Q 78 18 72 16" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

    <!-- Arched Segmented Tail Curving to Sharp Recurved Stinger -->
    <path d="M 55 87 Q 56 99 64 105 Q 74 111 84 108 Q 94 102 96 90 Q 97 78 88 68 Q 80 62 73 66" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

