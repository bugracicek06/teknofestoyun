    <path d="M 57 96 L 63 94 M 68 106 L 73 102 M 85 104 L 88 98 M 94 88 L 89 85" stroke="#FDE68A" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- 4 Pairs of Jointed Walking Legs Extending Gracefully -->
    <path d="M 41 55 Q 27 51 20 59 L 16 67 M 69 55 Q 83 51 90 59 L 94 67" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M 41 64 Q 25 62 18 71 L 14 81 M 69 64 Q 85 62 92 71 L 96 81" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M 42 73 Q 27 75 19 86 L 17 97 M 68 73 Q 83 75 91 86 L 93 97" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M 45 81 Q 32 87 26 100 L 26 112 M 65 81 Q 78 87 84 100 L 84 112" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
  </g>
