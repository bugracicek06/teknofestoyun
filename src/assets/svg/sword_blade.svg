<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 110" width="620" height="110">
  <defs>
    <!-- Damascus / Tempered Crucible Steel Gradient -->
    <linearGradient id="bladeSteelBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="12%" stop-color="#E2E8F0"/>
      <stop offset="28%" stop-color="#CBD5E1"/>
      <stop offset="48%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="90%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Longitudinal Specular Sheen Gradient -->
    <linearGradient id="bladeSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#E2E8F0" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#CBD5E1" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Fuller Groove Inset Shadow Gradient -->
    <linearGradient id="fullerGroove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Damascus Watered Steel Ripple Pattern -->
    <pattern id="damascusWave" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 10 5, 20 10 T 40 10" fill="none" stroke="#475569" stroke-width="0.7" opacity="0.35"/>
      <path d="M 0 16 Q 10 11, 20 16 T 40 16" fill="none" stroke="#64748B" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <!-- Drop Shadow for Depth -->
    <filter id="bladeDropShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#bladeDropShadow)">
    <!-- 1. Master Blade Solid Body: Curves from tip (15, 30) to ricasso base (620, 35 - 620, 75) -->
    <!-- Spine: (620, 35) -> curve down to (360, 48) -> curve up to (120, 38) -> yelman ridge (60, 26) -> tip (15, 30) -->
    <!-- Edge: (15, 30) -> curve down to (100, 72) -> curve to (320, 84) -> curve to ricasso bottom (620, 75) -->
    <path d="M 620 35 
             C 480 39, 360 48, 240 45 
             C 160 42, 100 32, 60 26 
             L 15 30 
             C 45 52, 90 74, 150 79 
             C 280 88, 440 85, 620 75 
             Z" 
          fill="url(#bladeSteelBody)" 
          stroke="#475569" 
          stroke-width="1.6" 
          stroke-linejoin="round"/>

    <!-- 2. Damascus Watered Steel Overlay -->
    <path d="M 620 35 
             C 480 39, 360 48, 240 45 
             C 160 42, 100 32, 60 26 
             L 15 30 
             C 45 52, 90 74, 150 79 
             C 280 88, 440 85, 620 75 
             Z" 
          fill="url(#damascusWave)"/>

    <!-- 3. Yelman (Double-Edged Raised False Tip Spine) -->
    <path d="M 60 26 C 90 29, 130 36, 170 41" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linecap="round" 
          opacity="0.9"/>
    <path d="M 15 30 L 60 26" 
          stroke="#FFFFFF" 
          stroke-width="2.2" 
          stroke-linecap="round"/>

    <!-- 4. Fuller Grooves (Tarihi Kan Oluğu) -->
    <!-- Primary Upper Fuller -->
    <path d="M 590 45 
             C 460 48, 360 55, 250 52 
             C 190 50, 150 45, 120 42" 
          stroke="url(#fullerGroove)" 
          stroke-width="3.5" 
          stroke-linecap="round"/>
    <path d="M 590 46 
             C 460 49, 360 56, 250 53 
             C 190 51, 150 46, 120 43" 
          stroke="#FFFFFF" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          opacity="0.8"/>

    <!-- Secondary Lower Shorter Fuller -->
    <path d="M 590 54 
             C 480 56, 390 62, 300 60" 
          stroke="url(#fullerGroove)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          opacity="0.75"/>

    <!-- 5. Razor-Sharp Beveled Cutting Edge Line (Alttaki Parlak Kesici Ağız) -->
    <path d="M 15 30 
             C 45 52, 90 74, 150 79 
             C 280 88, 440 85, 620 75" 
          stroke="#FFFFFF" 
          stroke-width="2.4" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- 6. Secondary Specular Edge Reflection Line -->
    <path d="M 35 44 
             C 70 61, 120 74, 180 77 
             C 300 83, 440 81, 600 72" 
          stroke="#E2E8F0" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          opacity="0.7" 
          fill="none"/>

    <!-- 7. Ricasso Decorative Gold Inlaid Ottoman Cartouche (Taban Altın Kakma) -->
    <path d="M 570 50 C 585 46, 605 46, 615 50 C 605 54, 585 54, 570 50 Z" 
          fill="#D97706" 
          stroke="#FDE68A" 
          stroke-width="1"/>
    <circle cx="592" cy="50" r="2" fill="#FEF3C7"/>
  </g>
</svg>
