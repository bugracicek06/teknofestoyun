<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 110" width="620" height="110">
  <defs>
    <!-- Damascus / Tempered Crucible Steel Gradient -->
    <linearGradient id="yataganSteelBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="14%" stop-color="#E2E8F0"/>
      <stop offset="32%" stop-color="#CBD5E1"/>
      <stop offset="52%" stop-color="#94A3B8"/>
      <stop offset="72%" stop-color="#475569"/>
      <stop offset="90%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Longitudinal Specular Sheen Gradient -->
    <linearGradient id="yataganSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#E2E8F0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#CBD5E1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Fuller Groove Inset Shadow Gradient -->
    <linearGradient id="yataganFuller" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Damascus Watered Steel Ripple Pattern -->
    <pattern id="damascusWaves" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 10 4, 20 10 T 40 10" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.32"/>
      <path d="M 0 16 Q 10 10, 20 16 T 40 16" fill="none" stroke="#64748B" stroke-width="0.6" opacity="0.22"/>
      <path d="M 5 6 Q 15 2, 25 6 T 45 6" fill="none" stroke="#94A3B8" stroke-width="0.5" opacity="0.2"/>
    </pattern>

    <!-- Gold Inlay (Koftgari / Kakma) Gradient -->
    <linearGradient id="goldInlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="yataganDropShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#yataganDropShadow)">
    <!-- 1. Master Yatağan Recurved Blade Body -->
    <!-- Characteristic recurved/forward-curved Yatağan geometry: -->
    <!-- Spine: (620, 44) -> (450, 48) -> slight concave dip (320, 52) -> sweeping up to yelman (100, 32) -> tip (15, 20) -->
    <!-- Edge: tip (15, 20) -> belly flare (100, 58) -> belly apex (300, 78) -> (480, 74) -> ricasso bottom (620, 68) -->
    <path d="M 620 44 
             C 480 48, 360 54, 260 48 
             C 180 42, 90 32, 15 20 
             C 65 50, 140 70, 240 76 
             C 380 82, 500 78, 620 68 
             Z" 
          fill="url(#yataganSteelBody)" 
          stroke="#475569" 
          stroke-width="1.6" 
          stroke-linejoin="round"/>

    <!-- 2. Damascus Watered Steel Ripple Overlay -->
    <path d="M 620 44 
             C 480 48, 360 54, 260 48 
             C 180 42, 90 32, 15 20 
             C 65 50, 140 70, 240 76 
             C 380 82, 500 78, 620 68 
             Z" 
          fill="url(#damascusWaves)"/>

    <!-- 3. Upper Yelman Ridge & Spine Bevel (Tarihi Yatağan Sırt Eğrisi) -->
    <path d="M 15 20 C 55 27, 120 36, 200 44" 
          stroke="#FFFFFF" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          opacity="0.9"/>
    <path d="M 200 44 C 340 54, 480 48, 620 44" 
          stroke="#CBD5E1" 
          stroke-width="1.4" 
          stroke-linecap="round" 
          opacity="0.7"/>

    <!-- 4. Yatağan Fuller Grooves (Kan Oluğu) -->
    <!-- Primary Upper Fuller running along the spine curvature -->
    <path d="M 590 50 
             C 470 54, 340 58, 240 52 
             C 170 47, 120 40, 80 34" 
          stroke="url(#yataganFuller)" 
          stroke-width="3.2" 
          stroke-linecap="round"/>
    <path d="M 590 51 
             C 470 55, 340 59, 240 53 
             C 170 48, 120 41, 80 35" 
          stroke="#FFFFFF" 
          stroke-width="1.1" 
          stroke-linecap="round" 
          opacity="0.8"/>

    <!-- Secondary Short Lower Fuller -->
    <path d="M 590 57 
             C 500 61, 410 63, 330 60" 
          stroke="url(#yataganFuller)" 
          stroke-width="2.0" 
          stroke-linecap="round"/>

    <!-- 5. Razor Cutting Edge Specular Highlight (Alt Ağız Keskinliği) -->
    <path d="M 15 20 
             C 65 50, 140 70, 240 76 
             C 380 82, 500 78, 620 68" 
          stroke="#FFFFFF" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.95"/>

    <!-- 6. Traditional Ottoman / Denizli Yatağan Gold Inlaid Arabesques (Altın Kakma Tezhip) -->
    <!-- Left Cartouche near Tip / Mid-Blade (X: 130 to 220) -->
    <g opacity="0.92">
      <!-- Decorative Border Box -->
      <path d="M 140 46 C 170 49, 200 52, 230 53" stroke="url(#goldInlay)" stroke-width="1.5" fill="none"/>
      <path d="M 145 61 C 175 65, 205 67, 235 68" stroke="url(#goldInlay)" stroke-width="1.5" fill="none"/>
      <!-- Arabesque Rumi Vines -->
      <path d="M 150 53 Q 165 48, 180 54 T 210 59" stroke="url(#goldInlay)" stroke-width="1.4" fill="none"/>
      <path d="M 160 55 Q 175 62, 190 56 T 225 61" stroke="url(#goldInlay)" stroke-width="1.2" fill="none"/>
      <!-- Flower Rosette Studs -->
      <circle cx="152" cy="53" r="2.2" fill="#FEF08A"/>
      <circle cx="185" cy="56" r="2.5" fill="#FEF08A"/>
      <circle cx="218" cy="60" r="2.2" fill="#FEF08A"/>
    </g>

    <!-- Right Cartouche near Ricasso / Guard (X: 430 to 570) -->
    <g opacity="0.92">
      <!-- Decorative Border Box -->
      <path d="M 430 53 C 470 52, 520 50, 570 48" stroke="url(#goldInlay)" stroke-width="1.5" fill="none"/>
      <path d="M 435 69 C 475 68, 525 66, 575 64" stroke="url(#goldInlay)" stroke-width="1.5" fill="none"/>
      <!-- Arabesque Rumi Vines -->
      <path d="M 440 60 Q 470 54, 500 61 T 560 56" stroke="url(#goldInlay)" stroke-width="1.4" fill="none"/>
      <path d="M 450 63 Q 480 68, 515 62 T 565 58" stroke="url(#goldInlay)" stroke-width="1.2" fill="none"/>
      <!-- Flower Rosette Studs -->
      <circle cx="445" cy="61" r="2.2" fill="#FEF08A"/>
      <circle cx="485" cy="58" r="2.5" fill="#FEF08A"/>
      <circle cx="525" cy="61" r="2.2" fill="#FEF08A"/>
      <circle cx="560" cy="57" r="2.2" fill="#FEF08A"/>
    </g>

    <!-- Center Engraving Framing Stars: ✦ [NAME ENGRAVING ZONE] ✦ (X: 245 to 415) -->
    <!-- Two delicate gold star rosettes flanking the central name engraving area -->
    <g fill="url(#goldInlay)" opacity="0.88">
      <path d="M 248 58 L 251 61 L 255 61 L 252 64 L 254 68 L 248 65 L 242 68 L 244 64 L 241 61 L 245 61 Z"/>
      <path d="M 412 59 L 415 62 L 419 62 L 416 65 L 418 69 L 412 66 L 406 69 L 408 65 L 405 62 L 409 62 Z"/>
    </g>

    <!-- 7. Blade Tang Extension (X: 600 to 620) - Slides smoothly under Guard Bolster -->
    <rect x="600" y="44" width="20" height="24" fill="#334155" opacity="0.85"/>
  </g>
</svg>
