<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 46" width="144" height="46">
  <defs>
    <!-- Rich Corded Leather Gradient -->
    <linearGradient id="gripLeatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854018"/>
      <stop offset="25%" stop-color="#5C260E"/>
      <stop offset="55%" stop-color="#3B1708"/>
      <stop offset="85%" stop-color="#240D04"/>
      <stop offset="100%" stop-color="#140602"/>
    </linearGradient>

    <!-- Brass Collar Gradient -->
    <linearGradient id="ferruleBrassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="85%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <filter id="gripDropShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#gripDropShadow)">
    <!-- 1. Central Ergonomic Leather Grip Body -->
    <!-- Gently flared towards ends: height 42 at edges, 38 at waist center -->
    <path d="M 16 3 
             Q 72 6, 128 3 
             L 128 43 
             Q 72 40, 16 43 
             Z" 
          fill="url(#gripLeatherGrad)" 
          stroke="#1A0701" 
          stroke-width="1.8"/>

    <!-- 2. Diagonal Corded Leather Wrap Segments & Raised Ribs -->
    <g stroke="#1A0701" stroke-width="2.5" opacity="0.8">
      <line x1="28" y1="4" x2="42" y2="42"/>
      <line x1="44" y1="4" x2="58" y2="42"/>
      <line x1="60" y1="5" x2="74" y2="41"/>
      <line x1="76" y1="5" x2="90" y2="41"/>
      <line x1="92" y1="4" x2="106" y2="42"/>
      <line x1="108" y1="4" x2="122" y2="42"/>
    </g>

    <!-- Highlight Stitch / Gold Wire Binding along each rib -->
    <g stroke="#D97706" stroke-width="1.2" opacity="0.85">
      <line x1="29" y1="4" x2="43" y2="42"/>
      <line x1="45" y1="4" x2="59" y2="42"/>
      <line x1="61" y1="5" x2="75" y2="41"/>
      <line x1="77" y1="5" x2="91" y2="41"/>
      <line x1="93" y1="4" x2="107" y2="42"/>
      <line x1="109" y1="4" x2="123" y2="42"/>
    </g>

    <!-- Specular Ridge Sheen Line across Top Surface -->
    <path d="M 18 8 Q 72 10, 126 8" stroke="#FDE68A" stroke-width="1.2" opacity="0.65" fill="none"/>

    <!-- 3. Left Brass Ferrule Ring (Meets Crossguard) -->
    <rect x="2" y="1" width="14" height="44" rx="3" fill="url(#ferruleBrassGrad)" stroke="#78350F" stroke-width="1.5"/>
    <line x1="6" y1="3" x2="6" y2="43" stroke="#FEF08A" stroke-width="1.2" opacity="0.8"/>
    <line x1="11" y1="3" x2="11" y2="43" stroke="#451A03" stroke-width="1.2" opacity="0.7"/>

    <!-- 4. Right Brass Ferrule Ring (Meets Pommel) -->
    <rect x="128" y="1" width="14" height="44" rx="3" fill="url(#ferruleBrassGrad)" stroke="#78350F" stroke-width="1.5"/>
    <line x1="132" y1="3" x2="132" y2="43" stroke="#FEF08A" stroke-width="1.2" opacity="0.8"/>
    <line x1="137" y1="3" x2="137" y2="43" stroke="#451A03" stroke-width="1.2" opacity="0.7"/>
  </g>
</svg>
