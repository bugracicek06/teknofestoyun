<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 46" width="144" height="46">
  <defs>
    <!-- Rich Dark Polished Walnut / Horn Wood Grain Gradient -->
    <linearGradient id="walnutWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2411"/>
      <stop offset="25%" stop-color="#321609"/>
      <stop offset="55%" stop-color="#230d04"/>
      <stop offset="85%" stop-color="#180802"/>
      <stop offset="100%" stop-color="#0c0401"/>
    </linearGradient>

    <!-- Brass Ferrule Ring Gradient -->
    <linearGradient id="gripFerruleBrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Gold Inlay (Kakma) Gradient -->
    <linearGradient id="gripGoldInlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="gripDropShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#gripDropShadow)">
    <!-- 1. Master Ergonomic Walnut Grip Body -->
    <!-- Contoured profile: height 44px at joints, waist at 41px -->
    <path d="M 14 1 
             Q 72 3.5, 130 1 
             L 130 45 
             Q 72 42.5, 14 45 
             Z" 
          fill="url(#walnutWoodGrad)" 
          stroke="#100502" 
          stroke-width="1.8"/>

    <!-- 2. Subtle Wood Texture Sheen -->
    <path d="M 16 6 Q 72 8, 128 6" stroke="#854d0e" stroke-width="1" opacity="0.4" fill="none"/>
    <path d="M 16 11 Q 72 13, 128 11" stroke="#fde68a" stroke-width="0.8" opacity="0.3" fill="none"/>

    <!-- 3. Ottoman Traditional Gold Inlaid Floral Vines & Rosettes (Altın Kakma Çiçekler) -->
    <!-- Matching the exact museum Yatagan hilt in the reference image -->
    <g fill="none" stroke="url(#gripGoldInlay)">
      <!-- Central Stem Sinuous Line -->
      <path d="M 22 23 Q 45 18, 72 23 T 122 23" stroke-width="1.4"/>
      <!-- Branch Leaflets -->
      <path d="M 35 22 Q 40 14, 46 16" stroke-width="1.1"/>
      <path d="M 42 24 Q 48 31, 54 28" stroke-width="1.1"/>
      <path d="M 60 21 Q 65 14, 71 16" stroke-width="1.1"/>
      <path d="M 73 24 Q 78 32, 85 29" stroke-width="1.1"/>
      <path d="M 90 22 Q 96 14, 102 16" stroke-width="1.1"/>
      <path d="M 98 24 Q 104 31, 110 29" stroke-width="1.1"/>
    </g>

    <!-- Inlaid Gold Rosettes (Petal Blossoms) -->
    <!-- Blossom 1 (Left: X: 34) -->
    <g transform="translate(34, 22)">
      <circle cx="0" cy="0" r="4.2" fill="url(#gripGoldInlay)" stroke="#78350F" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.6" fill="#FFFFFF"/>
      <circle cx="-3" cy="-3" r="1" fill="#FEF08A"/>
      <circle cx="3" cy="-3" r="1" fill="#FEF08A"/>
      <circle cx="-3" cy="3" r="1" fill="#FEF08A"/>
      <circle cx="3" cy="3" r="1" fill="#FEF08A"/>
    </g>

    <!-- Blossom 2 (Center: X: 72) -->
    <g transform="translate(72, 23)">
      <circle cx="0" cy="0" r="5.2" fill="url(#gripGoldInlay)" stroke="#78350F" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="2.0" fill="#FFFFFF"/>
      <circle cx="-4" cy="0" r="1.2" fill="#FEF08A"/>
      <circle cx="4" cy="0" r="1.2" fill="#FEF08A"/>
      <circle cx="0" cy="-4" r="1.2" fill="#FEF08A"/>
      <circle cx="0" cy="4" r="1.2" fill="#FEF08A"/>
    </g>

    <!-- Blossom 3 (Right: X: 110) -->
    <g transform="translate(110, 23)">
      <circle cx="0" cy="0" r="4.2" fill="url(#gripGoldInlay)" stroke="#78350F" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.6" fill="#FFFFFF"/>
      <circle cx="-3" cy="-3" r="1" fill="#FEF08A"/>
      <circle cx="3" cy="-3" r="1" fill="#FEF08A"/>
      <circle cx="-3" cy="3" r="1" fill="#FEF08A"/>
      <circle cx="3" cy="3" r="1" fill="#FEF08A"/>
    </g>

    <!-- Specular Highlight Ridge on Top Edge -->
    <path d="M 16 4 Q 72 6, 128 4" stroke="#FFFFFF" stroke-width="1.2" opacity="0.65" fill="none"/>

    <!-- 4. Left Brass Ferrule Collar Ring (Meets Crossguard) -->
    <rect x="2" y="1" width="12" height="44" rx="2" fill="url(#gripFerruleBrass)" stroke="#78350F" stroke-width="1.4"/>
    <line x1="5" y1="3" x2="5" y2="43" stroke="#FEF08A" stroke-width="1.2" opacity="0.85"/>
    <line x1="10" y1="3" x2="10" y2="43" stroke="#451A03" stroke-width="1.2" opacity="0.75"/>

    <!-- 5. Right Brass Ferrule Collar Ring (Meets Pommel with Exact Zero-Gap Alignment) -->
    <rect x="130" y="1" width="12" height="44" rx="2" fill="url(#gripFerruleBrass)" stroke="#78350F" stroke-width="1.4"/>
    <line x1="133" y1="3" x2="133" y2="43" stroke="#FEF08A" stroke-width="1.2" opacity="0.85"/>
    <line x1="138" y1="3" x2="138" y2="43" stroke="#451A03" stroke-width="1.2" opacity="0.75"/>
  </g>
</svg>
