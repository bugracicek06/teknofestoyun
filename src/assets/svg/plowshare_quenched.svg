<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 85" width="150" height="85">
  <defs>
    <!-- Hardened Quenched Dark Steel Gradient -->
    <linearGradient id="quenchedSteelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="25%" stop-color="#64748B"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="steelShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#steelShadow)">
    <!-- Pointed Triangular Quenched Iron Plowshare Blade (Finished Cold Steel) -->
    <!-- Blade Socket Base -->
    <path d="M 22 28 L 60 16 L 138 42 L 56 68 L 18 56 Q 26 42 22 28 Z" fill="url(#quenchedSteelGrad)" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Top Sharp Cutting Edge Highlight -->
    <path d="M 60 16 L 138 42" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 56 68 L 138 42" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Central Raised Rib Spine -->
    <path d="M 32 42 L 136 42" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <path d="M 38 42 L 130 42" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bevel Facet Shading -->
    <polygon points="60,16 138,42 32,42" fill="#E2E8F0" opacity="0.25"/>
    <polygon points="56,68 138,42 32,42" fill="#020617" opacity="0.35"/>

    <!-- Steel Tempering Blue-Grey Sheen Specular Sparkle -->
    <circle cx="132" cy="42" r="2" fill="#38BDF8" opacity="0.8"/>
    <circle cx="133" cy="42" r="1" fill="#FFFFFF"/>
  </g>
</svg>
