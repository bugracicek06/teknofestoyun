<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <!-- Red Iron Ore Mineral Gradient -->
    <linearGradient id="ironOreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05638"/>
      <stop offset="35%" stop-color="#B33924"/>
      <stop offset="70%" stop-color="#7A2214"/>
      <stop offset="100%" stop-color="#3D120B"/>
    </linearGradient>
    <filter id="oreShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#140604" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#oreShadow)">
    <!-- Angular Raw Iron Ore Chunk -->
    <polygon points="20,50 15,30 35,12 70,10 90,28 85,60 60,72 30,68" fill="url(#ironOreGrad)" stroke="#FFA07A" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Crystalline Facets -->
    <polygon points="35,12 55,30 70,10" fill="#E86E48" opacity="0.8"/>
    <polygon points="15,30 35,12 55,30 38,52" fill="#C94426" opacity="0.9"/>
    <polygon points="55,30 70,10 90,28 68,48" fill="#F08060" opacity="0.85"/>
    <polygon points="38,52 55,30 68,48 58,70 30,68" fill="#8F2716" opacity="0.95"/>
    <polygon points="68,48 90,28 85,60 58,70" fill="#5E180E" opacity="0.95"/>

    <!-- Metallic Specular Sparkles -->
    <circle cx="48" cy="24" r="1.5" fill="#FFE4E1"/>
    <circle cx="68" cy="38" r="1.2" fill="#FFE4E1"/>
  </g>
</svg>
