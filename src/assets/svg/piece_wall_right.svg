<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 210" width="100" height="210">
  <defs>
    <linearGradient id="wallPillarCapR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="35%" stop-color="#DEAA66"/>
      <stop offset="80%" stop-color="#9C5F25"/>
      <stop offset="100%" stop-color="#4C250A"/>
    </linearGradient>
    <linearGradient id="wallPillarShaftR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="40%" stop-color="#DEAA66"/>
      <stop offset="85%" stop-color="#8F541E"/>
      <stop offset="100%" stop-color="#452007"/>
    </linearGradient>
    <filter id="wallPillarShadowR" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="-2" dy="5" stdDeviation="3.5" flood-color="#1A0D04" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#wallPillarShadowR)">
    <!-- Base Niche Ground Shadow -->
    <ellipse cx="50" cy="200" rx="38" ry="8" fill="#1C0E04" opacity="0.65"/>

    <!-- Right Wall Depth Bevel -->
    <polygon points="72,48 82,52 90,192 78,198" fill="#422008" opacity="0.9"/>

    <!-- Vertical Shaft -->
    <polygon points="28,48 72,48 78,196 22,198" fill="url(#wallPillarShaftR)" stroke="#8A4A16" stroke-width="1.8"/>

    <!-- Chisel / Stone Layer Lines -->
    <path d="M 64 80 L 48 90 L 52 110" fill="none" stroke="#482208" stroke-width="1.5" opacity="0.6"/>
    <path d="M 36 135 L 46 155 L 32 175" fill="none" stroke="#482208" stroke-width="1.5" opacity="0.55"/>
    <line x1="71" y1="50" x2="77" y2="196" stroke="#FFF7E6" stroke-width="1.8" opacity="0.65"/>

    <!-- T-Cap Head -->
    <polygon points="88,10 94,18 96,52 88,48" fill="#3D1E08" opacity="0.95"/>
    <polygon points="12,10 88,10 88,48 6,48" fill="url(#wallPillarCapR)" stroke="#8A4A16" stroke-width="2"/>

    <!-- Cap Top Specular -->
    <line x1="14" y1="12" x2="86" y2="12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 70 20 L 58 32 L 64 40" fill="none" stroke="#482208" stroke-width="1.6" opacity="0.65"/>
  </g>
</svg>
