<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 210" width="100" height="210">
  <defs>
    <linearGradient id="wallPillarCapL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="35%" stop-color="#DEAA66"/>
      <stop offset="80%" stop-color="#9C5F25"/>
      <stop offset="100%" stop-color="#4C250A"/>
    </linearGradient>
    <linearGradient id="wallPillarShaftL" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="40%" stop-color="#DEAA66"/>
      <stop offset="85%" stop-color="#8F541E"/>
      <stop offset="100%" stop-color="#452007"/>
    </linearGradient>
    <filter id="wallPillarShadowL" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="-2" dy="5" stdDeviation="3.5" flood-color="#1A0D04" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#wallPillarShadowL)">
    <!-- Base Niche Ground Shadow -->
    <ellipse cx="50" cy="200" rx="38" ry="8" fill="#1C0E04" opacity="0.65"/>

    <!-- Left Wall Depth Bevel -->
    <polygon points="20,52 30,48 24,196 14,192" fill="#422008" opacity="0.9"/>

    <!-- Vertical Shaft -->
    <polygon points="30,48 72,48 78,198 24,196" fill="url(#wallPillarShaftL)" stroke="#8A4A16" stroke-width="1.8"/>

    <!-- Chisel / Stone Layer Lines -->
    <path d="M 36 80 L 52 90 L 48 110" fill="none" stroke="#482208" stroke-width="1.5" opacity="0.6"/>
    <path d="M 64 135 L 54 155 L 68 175" fill="none" stroke="#482208" stroke-width="1.5" opacity="0.55"/>
    <line x1="71" y1="50" x2="77" y2="196" stroke="#FFF7E6" stroke-width="1.8" opacity="0.65"/>

    <!-- T-Cap Head -->
    <polygon points="6,18 12,10 12,48 4,52" fill="#3D1E08" opacity="0.95"/>
    <polygon points="12,10 88,10 94,48 12,48" fill="url(#wallPillarCapL)" stroke="#8A4A16" stroke-width="2"/>

    <!-- Cap Top Specular -->
    <line x1="14" y1="12" x2="86" y2="12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 30 20 L 42 32 L 36 40" fill="none" stroke="#482208" stroke-width="1.6" opacity="0.65"/>
  </g>
</svg>
