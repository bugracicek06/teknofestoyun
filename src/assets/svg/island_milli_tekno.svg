<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Platform -->
  <ellipse cx="150" cy="220" rx="130" ry="55" fill="url(#skyGrad)" stroke="#38BDF8" stroke-width="4"/>

  <!-- High-Tech Skyline Silhouettes -->
  <rect x="70" y="150" width="25" height="60" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <rect x="100" y="130" width="35" height="80" fill="#334155" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="175" y="140" width="30" height="70" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <rect x="210" y="160" width="25" height="50" fill="#334155" stroke="#38BDF8" stroke-width="1"/>

  <!-- Radar Dome -->
  <circle cx="140" cy="170" r="18" fill="url(#radarGlow)" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 140 170 L 154 158" stroke="#00F2FE" stroke-width="2.5"/>

  <!-- Bayraktar IHA Aircraft -->
  <g transform="translate(150, 85)">
    <!-- Fuselage -->
    <path d="M 0 -35 L 8 10 L 4 30 L -4 30 L -8 10 Z" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Swept Wings -->
    <polygon points="-80,0 -8,-10 0,-15 8,-10 80,0 60,8 -8,2 8,2 -60,8" fill="#E2E8F0" stroke="#0284C7" stroke-width="1.5"/>
    <!-- V-Tail Twin Booms -->
    <path d="M -18 20 L -30 42 M 18 20 L 30 42" stroke="#64748B" stroke-width="3"/>
    <polygon points="-34,42 -26,42 -30,35" fill="#38BDF8"/>
    <polygon points="34,42 26,42 30,35" fill="#38BDF8"/>
    <!-- Red Crescent / Star Badge -->
    <circle cx="0" cy="-5" r="4" fill="#EF4444"/>
  </g>

  <!-- Flying Signal Waves -->
  <circle cx="150" cy="85" r="50" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="150" cy="85" r="75" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>
</svg>
