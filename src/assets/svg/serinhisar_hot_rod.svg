<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40">
  <defs>
    <linearGradient id="hotRodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FF6F00"/>
      <stop offset="90%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#4E1404"/>
    </linearGradient>
    <filter id="rodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FF6F00" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#rodGlow)">
    <!-- Heavy Glowing Hot Iron Stock Bar -->
    <rect x="15" y="10" width="130" height="20" rx="6" fill="url(#hotRodGrad)" stroke="#FFA000" stroke-width="2"/>
    <!-- Intense Hot White Center Line -->
    <line x1="25" y1="20" x2="135" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="35" y1="20" x2="125" y2="20" stroke="#FFF9C4" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
