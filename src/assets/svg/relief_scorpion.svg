    <path d="M 55 87 Q 56 99 64 105 Q 74 111 84 108 Q 94 102 96 90 Q 97 78 88 68 Q 80 62 73 66" stroke="#D4A259" stroke-width="5" stroke-linecap="round" fill="none"/>
