    <path d="M 45 81 Q 32 87 26 100 L 26 112 M 65 81 Q 78 87 84 100 L 84 112" stroke="#D4A259" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Controlled Negative Space Cuts -->
