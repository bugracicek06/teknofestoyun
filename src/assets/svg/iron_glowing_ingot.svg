<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 70" width="140" height="70">
  <defs>
    <!-- Glowing Molten Heat Gradient -->
    <linearGradient id="glowingIngotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FF6F00"/>
      <stop offset="85%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#4E1404"/>
    </linearGradient>
    <filter id="heatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF6F00" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#heatGlow)">
    <!-- 3D Heavy Red-Hot Iron Ingot Block -->
    <!-- Top Face -->
    <polygon points="35,16 115,16 128,30 20,30" fill="#FFF8E1" stroke="#FFCA28" stroke-width="1.5"/>
    <!-- Front Face -->
    <polygon points="20,30 128,30 120,54 14,54" fill="url(#glowingIngotGrad)" stroke="#FF8F00" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="35,16 20,30 14,54 26,44" fill="#FF8F00" stroke="#FF6F00" stroke-width="1.2"/>
    <!-- Right Face -->
    <polygon points="115,16 128,30 120,54 110,42" fill="#E65100" stroke="#BF360C" stroke-width="1.2"/>

    <!-- Intense Internal White-Hot Core Line -->
    <path d="M 32 30 L 118 30" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 40 38 L 105 38" stroke="#FFE082" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
