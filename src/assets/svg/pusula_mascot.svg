<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Glow -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#070B19" stop-opacity="0"/>
    </radialGradient>
    <!-- Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Aura Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#orbGlow)"/>

  <!-- Orbital Ring -->
  <ellipse cx="100" cy="100" rx="75" ry="25" fill="none" stroke="url(#ringGrad)" stroke-width="5" transform="rotate(-20 100 100)"/>

  <!-- Main Body Sphere -->
  <circle cx="100" cy="100" r="50" fill="url(#coreGrad)" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="85" cy="85" r="38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>

  <!-- Expressive Friendly Eyes -->
  <ellipse cx="85" cy="95" rx="7" ry="11" fill="#070B19"/>
  <ellipse cx="115" cy="95" rx="7" ry="11" fill="#070B19"/>
  <!-- Eye Highlights -->
  <circle cx="83" cy="91" r="3" fill="#FFFFFF"/>
  <circle cx="113" cy="91" r="3" fill="#FFFFFF"/>
  <circle cx="87" cy="98" r="1.5" fill="#00F2FE"/>
  <circle cx="117" cy="98" r="1.5" fill="#00F2FE"/>

  <!-- Cute Smile -->
  <path d="M 92 110 Q 100 118 108 110" fill="none" stroke="#070B19" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cheek Blushes -->
  <circle cx="76" cy="106" r="6" fill="#FF7E5F" opacity="0.6"/>
  <circle cx="124" cy="106" r="6" fill="#FF7E5F" opacity="0.6"/>

  <!-- Compass Needle Emblem on Forehead -->
  <polygon points="100,62 104,74 100,70 96,74" fill="#FFD700"/>
  <polygon points="100,78 104,74 100,70 96,74" fill="#00F2FE"/>

  <!-- Floating Star Particles -->
  <circle cx="155" cy="60" r="4" fill="#FFD700"/>
  <circle cx="45" cy="135" r="3" fill="#00F2FE"/>
  <circle cx="160" cy="130" r="2.5" fill="#FFFFFF"/>
</svg>
