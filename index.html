<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Medeniyetten Millî Teknolojiye Dokunmatik Ekran Kiosk Oyunu" />
    <title>Medeniyetten Millî Teknolojiye</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      if (window.location.pathname.startsWith('/certificate/')) {
        document.documentElement.classList.add('cert-route-active');
      }
      // Cleanly remove any platform-injected Netlify badge/drawer UI from DOM
      (function() {
        function removeNetlifyBadge() {
          const selectors = [
            'netlify-badge',
            '[data-netlify-badge]',
            '#netlify-badge',
            '.netlify-badge',
            'iframe[src*="netlify"]',
            'iframe[title*="Netlify" i]',
            'div[class*="netlify-badge" i]',
            'div[id*="netlify-badge" i]'
          ];
          for (const sel of selectors) {
            document.querySelectorAll(sel).forEach(el => el.remove());
          }
          document.querySelectorAll('a[href*="netlify.com"]').forEach(a => {
            const txt = (a.textContent || '').toLowerCase();
            if (txt.includes('netlify') || a.querySelector('img[src*="netlify"]')) {
              const root = document.getElementById('root');
              let curr = a as HTMLElement;
              while (curr && curr.parentElement && curr.parentElement !== document.body && curr.parentElement !== root) {
                curr = curr.parentElement;
              }
              if (curr && curr !== root && curr !== document.body) {
                curr.remove();
              }
            }
          });
        }
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
          window.addEventListener('load', removeNetlifyBadge);
          try {
            const observer = new MutationObserver(() => removeNetlifyBadge());
            observer.observe(document.documentElement, { childList: true, subtree: true });
          } catch (_) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
